<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">An AI reviewer on every pull request</title><desc id="desc">Left to right in four columns. First, a trigger: a push to the pull request branch, or a manual dispatch with the PR number. Second, a GitHub Actions job that checks out the repository, installs Node and Kiro CLI, and runs kiro-cli headless with the reviewer agent and the API key from a repository secret. Third, the reviewer agent, an amber box, reads four things: the ticket, the diff against main, the pull request body and the CI status, under the same guard hook as every other agent, with read-only permissions. Its only write is one comment-state review on the pull request. A red strip under the box says: never approves, never requests changes, never merges, never closes. Fourth, the human: reads the review as a script, runs the demo line, reads the diff against the criteria, and merges by hand. A note across the bottom says: the review is advice; the verdict and the merge are a human's.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
<style>text {font-family:Arial,Helvetica,sans-serif;fill:#172033} .title {font-size:30px;font-weight:700} .label {font-size:21px;font-weight:600} .body {font-size:20px;fill:#475569} .small {font-size:17px;fill:#475569} .code {font-family:Menlo,Consolas,monospace;font-size:15px;fill:#172033} .badge {font-size:16px;font-weight:700;fill:#ffffff} .arrow {fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)} .who {font-size:15px;font-weight:700;letter-spacing:1px} .no {font-size:16px;font-weight:700;fill:#b42318}</style></defs>
<rect width="1200" height="700" fill="white"/>
<rect x="24" y="24" width="1152" height="652" rx="12" fill="#f8fafc" stroke="#dce3eb" stroke-width="2"/>
<text x="600" y="78" class="title" text-anchor="middle">An AI reviewer on every pull request</text>
<text x="600" y="114" class="body" text-anchor="middle">The agent is the one amber box. It reads four things and writes one. The verdict and the merge stay with you.</text>

<!-- 1 trigger -->
<rect x="60" y="170" width="220" height="190" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<rect x="76" y="184" width="40" height="36" rx="8" fill="#64748b"/><text x="96" y="208" class="badge" text-anchor="middle">1</text>
<text x="128" y="209" class="label">Trigger</text>
<text x="76" y="244" class="small">A push to the PR branch,</text><text x="76" y="266" class="small">or a manual run with</text><text x="76" y="288" class="small">the PR number.</text>
<text x="76" y="326" class="code">gh workflow run</text><text x="76" y="346" class="code">  ai-review.yml -f pr=16</text>
<path d="M280 265 H312" class="arrow"/>

<!-- 2 actions job -->
<rect x="320" y="170" width="250" height="190" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
<rect x="336" y="184" width="40" height="36" rx="8" fill="#64748b"/><text x="356" y="208" class="badge" text-anchor="middle">2</text>
<text x="388" y="209" class="label">Actions job</text>
<text x="336" y="244" class="small">Checkout, Node, Kiro CLI.</text><text x="336" y="266" class="small">Key from a repo secret.</text><text x="336" y="288" class="small">Advisory: never fails the PR.</text>
<text x="336" y="326" class="code">kiro-cli chat --v3</text><text x="336" y="346" class="code">  --no-interactive --agent reviewer</text>
<path d="M570 265 H602" class="arrow"/>

<!-- 3 reviewer agent -->
<rect x="610" y="150" width="300" height="300" rx="12" fill="#fff4d6" stroke="#c08a1d" stroke-width="2"/>
<rect x="626" y="164" width="40" height="36" rx="8" fill="#c08a1d"/><text x="646" y="188" class="badge" text-anchor="middle">3</text>
<text x="678" y="189" class="label">Reviewer agent</text>
<text x="626" y="222" class="who" fill="#c08a1d">READS</text>
<text x="626" y="248" class="small">The ticket and its criteria</text>
<text x="626" y="270" class="small">The diff against main</text>
<text x="626" y="292" class="small">The PR body: Evidence, Merge Danger</text>
<text x="626" y="314" class="small">CI status</text>
<text x="626" y="348" class="who" fill="#c08a1d">WRITES</text>
<text x="626" y="374" class="small">One review, comment state only:</text>
<text x="626" y="396" class="small">verdict, criteria table, findings.</text>
<text x="626" y="430" class="code">gh pr review 16 --comment</text>
<rect x="610" y="462" width="300" height="60" rx="8" fill="#fde8e6" stroke="#b42318" stroke-width="1.5"/>
<text x="760" y="486" class="no" text-anchor="middle">Never approves. Never merges.</text>
<text x="760" y="508" class="no" text-anchor="middle">Never closes. Read-only on disk.</text>
<text x="626" y="548" class="small">Same guard hook as every agent in the repo,</text>
<text x="626" y="570" class="small">plus permission rules: allow-listed shell only.</text>
<path d="M910 265 H942" class="arrow"/>

<!-- 4 human -->
<rect x="950" y="170" width="190" height="280" rx="12" fill="#d9f2e9" stroke="#429782" stroke-width="2"/>
<rect x="966" y="184" width="40" height="36" rx="8" fill="#429782"/><text x="986" y="208" class="badge" text-anchor="middle">4</text>
<text x="1018" y="209" class="label">You</text>
<text x="966" y="244" class="small">Read the review</text><text x="966" y="266" class="small">as your script.</text>
<text x="966" y="300" class="small">Do the Demo line.</text>
<text x="966" y="334" class="small">Diff against the</text><text x="966" y="356" class="small">criteria. Tick boxes.</text>
<text x="966" y="390" class="small">Merge, by hand,</text><text x="966" y="412" class="small">if it holds.</text>
<text x="966" y="438" class="code">gh pr merge 16</text>

<!-- legend -->
<rect x="60" y="600" width="1080" height="52" rx="12" fill="#ffffff" stroke="#dce3eb" stroke-width="2"/>
<text x="80" y="633" class="who" fill="#c08a1d">AGENT</text><text x="150" y="633" class="small">3, in a fresh window, with no memory of writing the code.</text>
<text x="620" y="633" class="who" fill="#64748b">YOU</text><text x="668" y="633" class="small">1 and 4. The review is advice. The verdict and the merge are yours.</text>
</svg>
