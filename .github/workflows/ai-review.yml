name: AI review

# Advisory only. The reviewer agent writes one review to .ai-review/review.md
# and the job posts it as a comment-state review. The job never fails the PR.
# The merge decision stays with a human. See lessons/08.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The guard hook is `node scripts/agent-guard.mjs`, so the reviewer needs Node.
      # No pnpm here: the reviewer never installs or builds, and setup-node's
      # default cache step would fail looking for the pnpm binary.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install Kiro CLI
        run: curl -fsSL https://cli.kiro.dev/install | bash

      - name: Review the pull request
        id: review
        continue-on-error: true
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
          KIRO_HEADLESS_WORKFLOW_TIMEOUT_SECS: '900'
        run: |
          if [ -z "$KIRO_API_KEY" ]; then
            echo "::notice::KIRO_API_KEY is not set; skipping the AI review (expected on pull requests from forks)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p .ai-review
          kiro-cli chat --v3 --no-interactive --agent reviewer "Review pull request #${PR_NUMBER}."

      # Posting is the job's step, not the agent's. The agent can only write the
      # file. This is the one line that decides the review state, and it says
      # --comment. If the agent wrote nothing, say so on the PR instead of staying silent.
      - name: Post the review
        if: steps.review.outputs.skipped != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s .ai-review/review.md ]; then
            echo "::warning::The reviewer did not write .ai-review/review.md; see the step above."
            gh pr comment "$PR_NUMBER" --body "The AI review did not produce a review on this run. See the [run log](${RUN_URL})."
            exit 0
          fi
          gh pr review "$PR_NUMBER" --comment --body-file .ai-review/review.md
